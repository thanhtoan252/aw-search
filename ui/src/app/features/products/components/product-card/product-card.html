<p-card styleClass="aw-product-card">
  <div class="aw-product-card__layout">
    <div class="aw-product-card__media">
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        class="aw-product-card__image"
        loading="lazy"
      />
    </div>

    <div class="aw-product-card__content">
      <div class="aw-product-card__meta">
        <span class="aw-product-card__category">{{ product().category }}</span>
        <p-tag
          [value]="product().available ? 'In stock' : 'Out'"
          [severity]="product().available ? 'success' : 'danger'"
          [rounded]="true"
        />
      </div>

      <h2 class="aw-product-card__title">{{ product().name }}</h2>
      <p class="aw-product-card__description">{{ product().description }}</p>

      <div class="aw-product-card__tags">
        @for (tag of product().tags; track tag) {
          <span class="aw-product-card__tag">{{ tag }}</span>
        }
      </div>

      <app-product-match [product]="product()" />

      <div class="aw-product-card__footer">
        @if (product().price > 0) {
          <span class="aw-product-card__price">{{ product().price | currency }}</span>
        } @else {
          <span class="aw-product-card__price aw-product-card__price--unavailable">N/A</span>
        }
        <span class="aw-product-card__brand">{{ product().brand }}</span>
      </div>
    </div>
  </div>
</p-card>
